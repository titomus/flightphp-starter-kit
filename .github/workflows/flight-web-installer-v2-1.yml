name: Flight Starter Kit 2.1 web installer

on:
  push:
    branches:
      - main
      - feature/web-installer-v2-1
    tags:
      - 'v2.1.*-beta.*'
  pull_request:
    branches:
      - main
      - feature/flight-starter-v2
  workflow_dispatch:
    inputs:
      version:
        description: "Nouvelle version de prépublication (ex. v2.1.0-beta.1)"
        type: string
        required: true

permissions:
  contents: read

jobs:
  web-installer:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: PHP 8.3 + required extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, zip, curl, openssl, fileinfo
          coverage: none
          tools: composer:v2

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Static validation and recipe checks
        run: |
          set -euo pipefail
          php -v
          find installer web-installer tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          php tests/web-installer-smoke.php
          php tests/v2-smoke.php

      - name: Test HTTP installer session, unlock and CSRF
        run: bash tests/web-installer-http.sh

      - name: Build precompiled distributions for 3 themes
        run: bash scripts/build-web-distribution.sh "$GITHUB_WORKSPACE/dist"

      - name: Validate archive paths and bundled private runtime
        run: |
          set -euo pipefail
          test -s dist/flight-starter-runtime.zip
          test -s dist/flight-starter-runtime.zip.sha256
          cd dist
          sha256sum -c flight-starter-runtime.zip.sha256
          unzip -t flight-starter-runtime.zip | tail -n 2
          test "$(unzip -Z1 flight-starter-runtime.zip | grep -c '^runtime/build/.*/manifest.json$')" -eq 3
          unzip -Z1 flight-starter-runtime.zip | grep -q '^runtime/vendor/autoload.php$'
          ! unzip -Z1 flight-starter-runtime.zip | grep -Eq '(^|/)(node_modules|\.env)(/|$)'

      - name: Full CLI integration on clean project
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/web-distribution"
          unzip -q dist/flight-starter-runtime.zip -d "$RUNNER_TEMP/web-distribution"
          php tests/web-installer-smoke.php "$RUNNER_TEMP/web-distribution" dist/flight-starter-runtime.zip "$RUNNER_TEMP/web-http-site"

      - name: Verify generated site on actual HTTP routes
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/web-http-site"
          test -s "$APP/public/index.php"
          sed -i 's#APP_URL=https://example.test#APP_URL=http://127.0.0.1:8768#' "$APP/.env"
          cd "$APP"
          php -S 127.0.0.1:8768 -t public public/router.php > "$RUNNER_TEMP/web-project-http.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true; cat "$RUNNER_TEMP/web-project-http.log" || true' EXIT
          sleep 2
          curl -fsS http://127.0.0.1:8768/api/health | jq -e '.status == "ok"'
          echo "MCP ROUTES REGISTERED:"
          php -r 'define("APP_CONTEXT","web"); require "app/bootstrap.php"; foreach (\Flight::router()->getRoutes() as $r) { if (str_contains($r->pattern,"oauth") || $r->pattern === "/mcp") echo $r->pattern . PHP_EOL; }'
          echo "ADMIN HTTP:"
          curl -sS -o "$RUNNER_TEMP/web-admin.html" -w '%{http_code}\n' http://127.0.0.1:8768/admin/login
          grep -q 'Admin login' "$RUNNER_TEMP/web-admin.html"
          echo "OAUTH HTTP:"
          curl -sS -o "$RUNNER_TEMP/web-oauth.json" -w '%{http_code}\n' http://127.0.0.1:8768/.well-known/oauth-authorization-server
          head -c 400 "$RUNNER_TEMP/web-oauth.json"
          echo
          jq -e '.registration_endpoint == "http://127.0.0.1:8768/oauth/register"' "$RUNNER_TEMP/web-oauth.json"
          JS=$(php -r '$m=json_decode(file_get_contents("public/build/manifest.json"),true);echo $m["resources/js/app.js"]["file"];')
          CSS=$(php -r '$m=json_decode(file_get_contents("public/build/manifest.json"),true);echo $m["resources/js/app.js"]["css"][0];')
          test -n "$JS" && test -n "$CSS"
          curl -fsS "http://127.0.0.1:8768/build/$JS" > /dev/null
          curl -fsS "http://127.0.0.1:8768/build/$CSS" > /dev/null

      - name: Publish downloadable test files
        uses: actions/upload-artifact@v4
        with:
          name: flight-starter-web-v2-1
          path: |
            web-installer/install.php
            dist/flight-starter-runtime.zip
            dist/flight-starter-runtime.zip.sha256
          retention-days: 14
          if-no-files-found: error



  release:
    if: startsWith(github.ref, 'refs/tags/v2.1.') || github.event_name == 'workflow_dispatch'
    needs: web-installer
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: flight-starter-web-v2-1
          path: release-files
      - name: Publish a reviewed beta version, not a stable
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          REF: ${{ github.ref }}
          COMMIT: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "$REF" == refs/heads/* ]]; then
            test "$REF" = "refs/heads/main" || {
              echo "Choose main when publishing through Run workflow."
              exit 1
            }
          fi
          [[ "$VERSION" =~ ^v2\.1\.[0-9]+-beta\.[0-9]+$ ]] || {
            echo "Expected v2.1.X-beta.Y, never a stable version automatically."
            exit 1
          }
          if gh release view "$VERSION" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release version already exists; choose a new one."
            exit 1
          fi
          gh release create "$VERSION" \
            release-files/dist/flight-starter-runtime.zip \
            release-files/dist/flight-starter-runtime.zip.sha256 \
            release-files/web-installer/install.php \
            --repo "$REPO" \
            --target "$COMMIT" \
            --title "Flight Starter Kit $VERSION (bêta technique)" \
            --notes "Préversion de l'installateur web. Ne pas utiliser en production avant validation réelle sur l'hébergement cible. PHP 8.2+, HTTPS et document root public/ requis." \
            --prerelease
