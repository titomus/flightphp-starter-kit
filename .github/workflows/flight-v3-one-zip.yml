name: Flight Starter V3 one ZIP validation
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  v3-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, zip, curl, openssl, fileinfo
          tools: composer:v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and existing smoke tests
        run: |
          set -euo pipefail
          php -l web-installer/install.php
          php tests/v3-local-installer.php
          php tests/v3-mcp-admin.php
          php tests/v3-codegraft-native.php
          php tests/v3-codegraft-flow.php
          php tests/v3-mcp-native-actions.php
          php tests/v3-module-settings.php
          php tests/v3-lean-google-oauth.php
          php tests/web-installer-smoke.php
          php tests/v2-smoke.php
      - name: Build standalone V3 package
        run: bash scripts/build-v3-one-zip.sh "$GITHUB_WORKSPACE/dist"
      - name: Full install from bundled local runtime
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/v3-local-bundle"
          unzip -q dist/flight-starter-v3.0.0-beta.2.zip -d "$RUNNER_TEMP/v3-local-bundle"
          php tests/web-installer-smoke.php "$RUNNER_TEMP/v3-local-bundle/.flight-package"
          php -l "$RUNNER_TEMP/v3-local-bundle/public/install.php"
      - name: Inspect distribution
        run: |
          set -euo pipefail
          ZIP=dist/flight-starter-v3.0.0-beta.2.zip
          unzip -t "$ZIP" >/dev/null
          unzip -Z1 "$ZIP" | grep -q '^public/install.php$'
          unzip -Z1 "$ZIP" | grep -q '^.flight-package/installer/WebInstallEngine.php$'
          unzip -Z1 "$ZIP" | grep -q '^.flight-package/runtime/vendor/autoload.php$'
          unzip -Z1 "$ZIP" > "$RUNNER_TEMP/v3-entries.txt"
          ! grep -Eq '^\.flight-package/runtime/vendor/google/apiclient(-services)?/' "$RUNNER_TEMP/v3-entries.txt"
          unzip -Z1 "$ZIP" | grep -q '^.flight-package/runtime/build/saas/manifest.json$'
          (cd dist && sha256sum -c "$(basename "$ZIP").sha256")
          python3 scripts/audit-v3-zip.py "$ZIP"
          # Regression guard: don't ship the 130+ MiB Google API services again.
          unzip -Z1 "$ZIP" > "$RUNNER_TEMP/v3-entries.txt"
          ! grep -Eq '^\.flight-package/runtime/vendor/google/apiclient(-services)?/' "$RUNNER_TEMP/v3-entries.txt"
          # The prebuilt standalone archive should remain under 10 MiB.
          test "$(stat -c %s "$ZIP")" -lt 10485760
      - uses: actions/upload-artifact@v4
        with:
          name: flight-starter-v3-beta-one-zip
          path: |
            dist/flight-starter-v3.0.0-beta.2.zip
            dist/flight-starter-v3.0.0-beta.2.zip.sha256
          retention-days: 14

      - name: Publish tested V3 ZIP as a public prerelease from main
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=v3.0.0-beta.2
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release already exists: preserve the published download unchanged."
            exit 0
          fi
          gh release create "$VERSION" \
            "dist/flight-starter-$VERSION.zip" \
            "dist/flight-starter-$VERSION.zip.sha256" \
            --target "$GITHUB_SHA" \
            --title "Flight Starter Kit V3 avec CodeGraft ($VERSION)" \
            --notes "V3 beta.2 : MCP Native Actions (même service PHP exposé via web + MCP), contrôles ACL/tenant, écran de parité et CodeGraft intégré. ZIP autonome pour site de test neuf. Tests automatiques réalisés ; OAuth membre/tenant et recette o2switch encore nécessaires. Ne pas écraser une installation existante." \
            --prerelease
