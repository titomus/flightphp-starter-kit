name: Deploy artisan demo to o2switch

# This deployment is deliberately NOT triggered by ordinary code changes.
# When the repository secrets are ready, create/update the deploy-request file
# on demo/artisan-catalog to trigger a reviewed deployment.
on:
  workflow_dispatch:
  push:
    branches:
      - demo/artisan-catalog
    paths:
      - examples/artisan-catalog/deploy-request.txt

permissions:
  contents: read

concurrency:
  group: artisan-o2switch-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: artisan-demo
    env:
      CPANEL_TOKEN: ${{ secrets.O2_CPANEL_API_TOKEN }}
      SSH_PRIVATE_KEY: ${{ secrets.O2_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.O2_SSH_KNOWN_HOSTS }}
      ADMIN_EMAIL: ${{ secrets.ARTISAN_ADMIN_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.ARTISAN_ADMIN_PASSWORD }}
      APP_PATH: /home/titomus/test-github.zootz.fr
    steps:
      - name: Verify deployment secrets (without printing them)
        shell: bash
        run: |
          set -euo pipefail
          for name in CPANEL_TOKEN SSH_PRIVATE_KEY SSH_KNOWN_HOSTS ADMIN_EMAIL ADMIN_PASSWORD; do
            case "$name" in
              CPANEL_TOKEN) value="$CPANEL_TOKEN" ;;
              SSH_PRIVATE_KEY) value="$SSH_PRIVATE_KEY" ;;
              SSH_KNOWN_HOSTS) value="$SSH_KNOWN_HOSTS" ;;
              ADMIN_EMAIL) value="$ADMIN_EMAIL" ;;
              ADMIN_PASSWORD) value="$ADMIN_PASSWORD" ;;
            esac
            if [ -z "$value" ]; then
              echo "::error::Missing GitHub secret: $name"
              exit 1
            fi
          done
          if [[ ! "$ADMIN_EMAIL" =~ ^[^[:space:]]+@[^[:space:]]+$ ]]; then
            echo "::error::Invalid admin email"
            exit 1
          fi
          if [[ ! "$ADMIN_PASSWORD" =~ ^[a-zA-Z0-9_!@#%+=:.,-]{20,128}$ ]]; then
            echo "::error::Use a 20-128 character admin password with letters, digits and _!@#%+=:.,-"
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Generate SaaS and install dependencies
        shell: bash
        run: |
          set -euo pipefail
          php examples/artisan-catalog/build.php "$RUNNER_TEMP/atelier-catalogue"
          cd "$RUNNER_TEMP/atelier-catalogue"
          composer install --no-interaction --no-progress --prefer-dist --no-dev --optimize-autoloader
          npm install --no-audit --no-fund
          npm run build
          test -f public/manifest.json
          php app/Console/console.php migrate
          cd "$GITHUB_WORKSPACE"
          php examples/artisan-catalog/smoke.php "$RUNNER_TEMP/atelier-catalogue"
          # The runtime DB and npm dependency cache must never be deployed.
          rm -rf "$RUNNER_TEMP/atelier-catalogue/node_modules"

      - name: Whitelist only this GitHub runner in the o2switch SSH firewall
        id: whitelist
        shell: bash
        run: |
          set -euo pipefail
          RUNNER_IP="$(curl -4fsS --retry 2 --max-time 15 https://api.ipify.org)"
          if [[ ! "$RUNNER_IP" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]]; then
            echo "::error::Cannot determine runner IPv4 address"
            exit 1
          fi
          echo "runner_ip=$RUNNER_IP" >> "$GITHUB_OUTPUT"
          URL="https://nice.o2switch.net:2083/execute/SshWhitelist"
          CURRENT="$(curl -fsS --max-time 45 -H "Authorization: cpanel titomus:$CPANEL_TOKEN" "$URL/list")"
          printf '%s' "$CURRENT" | jq -e '.status == 1' >/dev/null

          if printf '%s' "$CURRENT" | jq -e --arg ip "$RUNNER_IP" '.data.list | any(.address == $ip and .port == 22 and .direction == "in")' >/dev/null; then
            echo "Runner IP already authorized; leaving existing authorization unchanged."
            echo "added=false" >> "$GITHUB_OUTPUT"
          else
            COUNT="$(printf '%s' "$CURRENT" | jq -r '.data.count // 0')"
            if [ "$COUNT" -ge 5 ]; then
              echo "::error::o2switch SSH whitelist is full (5/5). Remove an unused entry manually, never automatically."
              exit 1
            fi
            # Mark for cleanup before calling the API, including after partial failures.
            echo "added=true" >> "$GITHUB_OUTPUT"
            RESPONSE="$(curl -fsS --max-time 60 -H "Authorization: cpanel titomus:$CPANEL_TOKEN" "$URL/add?address=$RUNNER_IP&port=22")"
            printf '%s' "$RESPONSE" | jq -e '.status == 1' >/dev/null
            echo "Authorized runner $RUNNER_IP for port 22."
          fi

      - name: Install pinned SSH host key and deployment identity
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/artisan_deploy_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/artisan_deploy_key" "$HOME/.ssh/known_hosts"
          ssh-keygen -F nice.o2switch.net -f "$HOME/.ssh/known_hosts" >/dev/null
          ssh-keygen -y -f "$HOME/.ssh/artisan_deploy_key" > /dev/null

      - name: Check remote document root and PHP prerequisites
        shell: bash
        run: |
          set -euo pipefail
          ssh -p 22 -i "$HOME/.ssh/artisan_deploy_key" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=25 \
            titomus@nice.o2switch.net 'bash -se' <<'REMOTE'
          set -eu
          APP=/home/titomus/test-github.zootz.fr
          test -d "$APP/public" || { echo "Expected document root not found: $APP/public"; exit 1; }
          if [ ! -f "$APP/.atelier-catalogue-managed" ]; then
            if [ -n "$(find "$APP/public" -mindepth 1 -maxdepth 1 -print -quit)" ]; then
              echo "Refusing to overwrite a non-empty, unmanaged document root."
              exit 1
            fi
            if [ -n "$(find "$APP" -mindepth 1 -maxdepth 1 ! -name public -print -quit)" ]; then
              echo "Refusing to overwrite existing, unmanaged files in application directory."
              exit 1
            fi
          fi
          command -v php >/dev/null
          php -r 'if (PHP_VERSION_ID < 80100 || !extension_loaded("pdo_sqlite") || !extension_loaded("mbstring")) { fwrite(STDERR, "PHP 8.1+, pdo_sqlite and mbstring are required.\n"); exit(1); }'
          REMOTE

      - name: Provision production environment if missing (preserve on updates)
        shell: bash
        run: |
          set -euo pipefail
          {
            printf 'APP_NAME=Atelier Catalogue\n'
            printf 'APP_ENV=production\n'
            printf 'APP_DEBUG=false\n'
            printf 'APP_URL=https://test-github.zootz.fr\n'
            printf 'APP_TIMEZONE=Europe/Paris\n'
            printf 'ADMIN_EMAIL=%s\n' "$ADMIN_EMAIL"
            printf 'ADMIN_PASSWORD=%s\n' "$ADMIN_PASSWORD"
            printf 'MCP_BEARER_TOKEN=\n'
            printf 'MCP_ALLOW_WRITES=false\n'
          } | ssh -p 22 -i "$HOME/.ssh/artisan_deploy_key" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            titomus@nice.o2switch.net \
            'umask 077; target=/home/titomus/test-github.zootz.fr/.env; if [ ! -e "$target" ]; then cat > "$target"; chmod 600 "$target"; else cat >/dev/null; fi'

      - name: Upload generated application (never delete or overwrite runtime data)
        shell: bash
        run: |
          set -euo pipefail
          rsync -az --timeout=90 \
            --exclude='/.env' \
            --exclude='/app/storage/***' \
            --exclude='/node_modules/***' \
            -e "ssh -p 22 -i $HOME/.ssh/artisan_deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes" \
            "$RUNNER_TEMP/atelier-catalogue/" \
            "titomus@nice.o2switch.net:/home/titomus/test-github.zootz.fr/"

      - name: Run remote migrations and create the initial admin account
        shell: bash
        run: |
          set -euo pipefail
          ssh -p 22 -i "$HOME/.ssh/artisan_deploy_key" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            titomus@nice.o2switch.net 'bash -se' <<'REMOTE'
          set -eu
          cd /home/titomus/test-github.zootz.fr
          mkdir -p app/storage/cache app/storage/logs app/storage/queue
          chmod 700 app/storage
          php app/Console/console.php migrate
          php app/Console/console.php seed
          touch .atelier-catalogue-managed
          REMOTE

      - name: Verify deployed public health endpoint
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE="$(curl -fsS --max-time 25 https://test-github.zootz.fr/api/health)"
          printf '%s' "$RESPONSE" | jq -e '.status == "ok"' >/dev/null
          echo "Deployed health check: OK"
          echo "Catalog login: https://test-github.zootz.fr/admin/login"

      - name: Remove only this runner SSH authorization
        if: always() && steps.whitelist.outputs.added == 'true'
        shell: bash
        env:
          DEPLOY_RUNNER_IP: ${{ steps.whitelist.outputs.runner_ip }}
        run: |
          set -euo pipefail
          URL="https://nice.o2switch.net:2083/execute/SshWhitelist"
          for DIR in in out; do
            if ! curl -fsS --max-time 60 -H "Authorization: cpanel titomus:$CPANEL_TOKEN" \
              "$URL/remove?address=$DEPLOY_RUNNER_IP&port=22&direction=$DIR" \
              | jq -e '.status == 1' > /dev/null; then
              echo "::warning::SSH whitelist cleanup failed for direction $DIR; check cPanel."
            fi
          done
          echo "Cleaned temporary SSH authorization for $DEPLOY_RUNNER_IP"
